[project]
name = "resonance-lab"
version = "0.1.0"
description = "Resonance Lab: an engineered two-agent simulation exploring music as a nonverbal channel that shapes persistent internal state."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "anyio>=4"]
# Optional runtime model providers. None are required for local experimental mode.
localmodel = ["llama-cpp-python>=0.3"]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["resonance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: exercises the real local model; skip with RESONANCE_SKIP_SLOW=1"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
